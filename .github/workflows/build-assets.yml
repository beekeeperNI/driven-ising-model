name: Build Ising demos and figures
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-assets.yml
      - tools/generate_demo_assets.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build figures using original simulator core
        run: python tools/generate_demo_assets.py
      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demos assets/results assets/validation results/validation_L40_T2_energy.npz
          git diff --cached --quiet || git commit -m "assets: render GIF demos and simulation figures"
          git push
